# Optional overlay: docker compose -f compose.yaml -f compose.collabora.yaml up -d --build web collabora
services:
  web:
    volumes:
      - ${COLLABORA_CUSTOM_FONTS:-./instance/office-fonts}:/opt/yourwiki-fonts:ro
    environment:
      GOOGLE_FONTS_DIR: /opt/yourwiki-fonts
      COLLABORA_URL: ${COLLABORA_URL:?Set COLLABORA_URL to your public HTTPS URL with /collabora}
      COLLABORA_INTERNAL_URL: http://collabora:9980/collabora
      COLLABORA_WOPI_URL: ${COLLABORA_WOPI_URL:?Set COLLABORA_WOPI_URL to your public Yourwiki HTTPS URL}
  collabora:
    image: ${COLLABORA_IMAGE:-collabora/code@sha256:bb8f3c9c5c9016045f25fccb5f0649be94469ebc7c7cc379f3576e470cccf33d}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COLLABORA_PORT:-9980}:9980"
    environment:
      aliasgroup1: ${COLLABORA_WOPI_URL}
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true --o:net.service_root=/collabora --o:logging.level=warning --o:welcome.enable=false --o:remote_font_config.url=${COLLABORA_WOPI_URL}/office/fonts.json"
    volumes:
      - ${COLLABORA_ACTIVE_FONTS:-./instance/office-active-fonts}:/usr/share/fonts/truetype/yourwiki-private:ro
      - ${COLLABORA_ACTIVE_FONTS:-./instance/office-active-fonts}:/opt/cool/systemplate/usr/share/fonts/truetype/yourwiki-private:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    cap_add:
      - MKNOD
