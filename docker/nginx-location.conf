# Include inside your HTTPS server {}. Yourwiki listens on loopback port 3000.
# Yourwiki enforces the administrator size setting; 0 also supports unlimited uploads.
# Compress editor scripts/styles; binary documents and font archives are excluded.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/css application/javascript text/javascript image/svg+xml;
client_max_body_size 0;
client_body_timeout 300s;
send_timeout 300s;
error_page 413 =413 /__yourwiki_upload_limit;
error_page 408 =408 /__yourwiki_upload_timeout;
error_page 504 =504 /__yourwiki_proxy_timeout;
location = /__yourwiki_upload_limit {
    internal;
    default_type text/plain;
    return 413 "Upload rejected by a proxy size limit. Check client_max_body_size on every proxy.\n";
}
location = /__yourwiki_upload_timeout {
    internal;
    default_type text/plain;
    return 408 "Nginx timed out while receiving the upload. Retry or ask the administrator to check client_body_timeout.\n";
}
location = /__yourwiki_proxy_timeout {
    internal;
    default_type text/plain;
    return 504 "Nginx timed out waiting for Yourwiki. Check whether the file was saved before retrying. Ask the administrator to check the storage connection and proxy timeouts.\n";
}
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
