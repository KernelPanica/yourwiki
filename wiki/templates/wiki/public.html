{% load static wiki_ui i18n %}<!doctype html>{% get_current_language as CURRENT_LANGUAGE %}<html lang="{{ CURRENT_LANGUAGE }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f3f6f5"><title>Yourwiki</title>{% include 'wiki/favicon.html' %}<link rel="stylesheet" href="{% static 'wiki/style.css' %}"><link rel="stylesheet" href="{% static 'wiki/sleek.css' %}"><script src="{% url 'javascript-catalog' %}"></script><script src="{% static 'wiki/theme.js' %}"></script><script src="{% static 'wiki/ui-errors.js' %}" defer></script><script src="{% static 'wiki/loading.js' %}" defer></script></head><body><a class="skip-link" href="#main-content">{% translate "Skip to main content" %}</a><main class="login-page" id="main-content"><section class="login-card"><div class="brand"><span class="brand-mark">{% icon 'book' %}</span>Yourwiki</div>{% block content %}{% endblock %}<button class="button theme-toggle" type="button" data-theme-toggle>{% translate 'Dark theme' %}</button></section></main></body></html>
