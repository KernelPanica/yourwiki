<rect data-node-id="{{ node.id }}" data-node-type="{{ node.type }}" x="{{ node.x }}" y="{{ node.y }}" width="{{ node.width }}" height="{{ node.height }}" rx="9" fill="{{ node.color }}" stroke="#c3d7cd"/>
<foreignObject x="{{ node.inner_x }}" y="{{ node.inner_y }}" width="{{ node.inner_width }}" height="{{ node.inner_height }}"><div xmlns="http://www.w3.org/1999/xhtml" class="node-label">{{ node.label }}</div></foreignObject>
