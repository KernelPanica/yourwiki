{% extends 'wiki/base.html' %}{% block content %}<div class="page-heading"><h1>{{ doc.title }}</h1><p>Stored in {{ provider_label }}. Download to open this file.</p></div><div class="form-actions"><a class="button primary" href="{% url 'export' doc.pk %}">Download file</a>{% if can_write %}<a class="button" href="{% url 'move' 'document' doc.pk %}">Move</a><a class="button danger" href="{% url 'delete' doc.pk %}">Delete</a>{% endif %}{% if can_policy %}<a class="button" href="{% url 'policy' doc.pk %}">Permissions</a>{% endif %}</div>{% endblock %}
