name: yourwiki
x-app: &app
  build: .
  image: yourwiki:local
  volumes:
    - database:/data
    - secrets:/secrets
    - documents:/documents
  ports:
    - "127.0.0.1:${YOURWIKI_PORT:-3000}:8000"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:mode=1777,size=64m
  read_only: true
  init: true
services:
  web:
    <<: *app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
  setup:
    <<: *app
    profiles: [setup]
    entrypoint: ["python", "install.py"]
    stdin_open: true
    tty: true
volumes:
  database:
  secrets:
  documents:
