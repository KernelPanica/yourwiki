name: TypeScript application and container checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            apps/web/package-lock.json
      - run: npm ci --prefix apps/server
      - run: npm ci --prefix apps/web --ignore-scripts
      - run: npm --prefix apps/server run typecheck
      - run: npm --prefix apps/server test
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web test
      - run: npm run build:v2
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t yourwiki:ci .
