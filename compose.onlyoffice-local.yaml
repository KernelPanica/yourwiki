# Isolated local test installation. Never combine with production Compose files.
name: yourwiki-onlyoffice
x-app: &app
  build: .
  image: yourwiki:onlyoffice-local
  user: "10001:10001"
  volumes: [workspace:/data]
  init: true
  restart: unless-stopped
services:
  web:
    <<: *app
    command: [web]
    environment:
      YOURWIKI_PUBLIC_URL: http://127.0.0.1:3010
      YOURWIKI_OFFICE_ENGINE: onlyoffice
      ONLYOFFICE_URL: http://127.0.0.1:8082
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_WOPI_URL: http://web:3100
    ports: ["127.0.0.1:3010:3100"]
    security_opt:
      - seccomp=./docker/v2/seccomp-sandbox.json
      - apparmor=unconfined
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/ready/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  conversion:
    <<: *app
    command: [conversion]
    security_opt:
      - seccomp=./docker/v2/seccomp-sandbox.json
      - apparmor=unconfined
    depends_on:
      web: {condition: service_healthy}
  onlyoffice:
    image: onlyoffice/documentserver:10.0.0@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
    restart: unless-stopped
    environment:
      WOPI_ENABLED: "true"
      PLUGINS_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_LOCAL_JWT_SECRET:?Run tools/release/onlyoffice-local.sh first}
    ports: ["127.0.0.1:8082:80"]
    # Fresh vendor caches/database for v10; old v9 volumes remain available.
    # YourWiki documents live separately in workspace and are not migrated.
    volumes:
      - ./docker/onlyoffice/start.sh:/onlyoffice-local-start.sh:ro
      - onlyoffice-v10-data:/var/www/onlyoffice/Data
      - onlyoffice-v10-lib:/var/lib/onlyoffice
    entrypoint: ["/bin/bash", "/onlyoffice-local-start.sh"]
    shm_size: 256m
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost/healthcheck]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
volumes:
  workspace:
  onlyoffice-v10-data:
  onlyoffice-v10-lib:
